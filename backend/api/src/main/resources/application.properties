spring.application.name=api

spring.datasource.url=jdbc:mysql://localhost/finance_ia
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Le dice a Hibernate c�mo generar SQL para tu base de datos
#hibernite.dialect=org.hibernate.dialect.HSQLDialect

#Bases de datos
#Muestra las queries SQL en consola
spring.jpa.show-sql=true
spring.jpa.format-sql=true

# Configuraci�n de JPA, actualiza cualquier cambio
spring.jpa.hibernate.ddl-auto=update

# L�mites de tama�o para la carga de archivos
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

#Controla c�mo se formatea la respuesta JSON cuando usas paginaci�n
spring.data.web.pageable.page-serialization-mode=via_dto

# --- CONFIGURACI�N DE SWAGGER / OPENAPI (SPRINGDOC) ---

# Ruta para obtener la especificaci�n de la API en formato JSON (Por defecto: /v3/api-docs)
springdoc.api-docs.path=/api-docs
# URL de acceso a la interfaz gr�fica interactiva de Swagger UI (Por defecto: /swagger-ui.html)
springdoc.swagger-ui.path=/swagger-ui.html
# Ordena los endpoints en la interfaz alfab�ticamente por su m�todo HTTP (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operationsSorter=method

# --- NUMERO MAXIMO DE RECOMENDACIONES ---
recommendation.max-recommendations=3
