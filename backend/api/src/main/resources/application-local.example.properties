# Configuración local

# Este archivo es una plantilla para configurar el entorno local de cada desarrollador.
# Para utilizarlo, copia este archivo y renómbralo como:
#
# application-local.properties
#
# Luego reemplaza los valores de ejemplo por las credenciales de tu instalación local de MySQL.
#
# IMPORTANTE:
# No modifiques las credenciales directamente en application.properties.
# Cada desarrollador debe mantener su propia configuración local en application-local.properties.
# ============================================================
# BASE DE DATOS
# ============================================================
# Usuario de MySQL de tu instalación local.
spring.datasource.username=TU_USUARIO
# Contraseña del usuario de MySQL de tu instalación local.
spring.datasource.password=TU_PASSWORD
# ============================================================
# ACTIVAR EL PERFIL LOCAL
# ============================================================
# Spring Boot carga application-local.properties cuando el perfil "local" se encuentra activo.
#
# Si utilizas Maven desde la terminal, ejecuta:
#
# mvn spring-boot:run -Dspring-boot.run.profiles=local
#
# En Windows también puedes utilizar:
#
# mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
#
# ============================================================
# CONFIGURACIÓN DE VS CODE
# ============================================================
#
# Si utilizas VS Code, puedes configurar el archivo launch.json para activar automáticamente el perfil "local" al presionar Run.
#
# launch.json es un archivo de configuración específico del proyecto y normalmente se encuentra en:
#
#     .vscode/launch.json
#
# Para abrirlo rápidamente en VS Code:
#
#     Ctrl + Shift + P
#
# Luego busca:
#
#     Debug: Open launch.json
#
# También puedes abrir el panel "Run and Debug" con:
#
#     Ctrl + Shift + D
#
# y seleccionar "Open 'launch.json'" si está disponible.
#
# Si el archivo ya existe, NO es necesario reemplazar toda su configuración. Puedes editar la configuración existente y agregar/modificar únicamente los parámetros necesarios.
# Para que Spring Boot utilice el perfil "local", asegúrate de que la configuración correspondiente a la aplicación Java
# contenga:
#
#     "type": "java"
#     "request": "launch"
#     "mainClass": "com.finance_ia.api.ApiApplication"
#     "args": "--spring.profiles.active=local"
#
# El parámetro MÁS IMPORTANTE que debes agregar o modificar es:
#
#     "args": "--spring.profiles.active=local"
#
# Este parámetro indica a Spring Boot que debe activar el perfil
# "local" al ejecutar la aplicación desde VS Code.
#
# Una configuración completa de ejemplo sería:
#
#     {
#         "type": "java",
#         "request": "launch",
#         "name": "Finance AI API",
#         "mainClass": "com.finance_ia.api.ApiApplication",
#         "args": "--spring.profiles.active=local"
#     }
#
# De esta forma, al seleccionar "Finance AI API" en Run and Debug y presionar Run, Spring Boot utilizará automáticamente:
#
#     application.properties
#     application-local.properties
#
# Si tu launch.json ya contiene otras configuraciones, conserva las existentes y modifica únicamente la configuración utilizada para iniciar la API.
#
# NOTA:
# launch.json pertenece al proyecto actual. Otros proyectos pueden tener su propio .vscode/launch.json con configuraciones diferentes.
#
# De esta forma, al ejecutar la aplicación desde VS Code se utilizará automáticamente application-local.properties.
#
# En otras IDE, busca la configuración de ejecución de Spring Boot y establece "local" como perfil activo.
# ============================================================
# RESUMEN
# ============================================================
#
# 1. Copia este archivo como application-local.properties.
#
# 2. Configura TU_USUARIO y TU_PASSWORD con las credenciales de tu instalación local de MySQL.
#
# 3. Activa el perfil "local" al ejecutar la aplicación.
#
# 4. No modifiques las credenciales de "application.properties" 
#
# Objetivo: Permitir a cada desarrollador utilizar sus propias credenciales de MySQL sin afectar la configuración de los demás.
